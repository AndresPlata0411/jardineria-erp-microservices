resolver 127.0.0.11 valid=10s;

# Detras de Caddy llega X-Forwarded-Proto=https: se conserva en lugar de pisarlo con "http".
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    location /api/clientes/    { proxy_pass http://clientes:8000/; }
    location /api/operaciones/ { proxy_pass http://operaciones:8000/; }
    location /api/reportes/    { proxy_pass http://reportes:8000/; }

    # El frontend se resuelve en tiempo de ejecucion (la variable evita que nginx falle al arrancar).
    location = /app { return 301 /app/; }
    location /app/ {
        set $frontend http://frontend:8501;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    location = / { return 302 /app/; }
}
